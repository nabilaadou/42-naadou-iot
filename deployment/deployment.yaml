apiVersion: apps/v1
kind: Deployment
metadata:
  name: wil42
  labels:
    app: wil42
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wil42
  template:
    metadata:
      labels:
        app: wil42
    spec:
      containers:
        - name: wil42
          image: wil42/playground:v1
---
apiVersion: v1
kind: Service
metadata:
  name: wil42-service
spec:
  selector:
    app: wil42
  ports:
    - port: 8888
